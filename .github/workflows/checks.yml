name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pc.txt
      - run: python -m compileall -q board plugins tools experiments auto-tunnel.py
      - run: python -m unittest discover -s tests -p test_policy.py -v
      - run: python -m unittest discover -s tests -p test_web_search.py -v
      - run: python -m unittest discover -s tests -p test_social.py -v
      - run: for script in board/*.sh; do bash -n "$script"; done
