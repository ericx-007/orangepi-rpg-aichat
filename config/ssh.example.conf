Host orangepi-local-llm
    HostName 192.0.2.10
    User YOUR_SSH_USER
    IdentityFile ~/.ssh/orangepi_chat
    StrictHostKeyChecking yes
    BatchMode yes
    ConnectTimeout 10
    ServerAliveInterval 15
    ServerAliveCountMax 3
    ExitOnForwardFailure yes
    LocalForward 127.0.0.1:8000 127.0.0.1:8000
